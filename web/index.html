<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SafeWeb Gateway</title><style>body{font-family:Segoe UI,Arial;background:#f5f7fb;margin:0;color:#18212f}main{max-width:1150px;margin:28px auto;padding:0 20px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{background:#fff;border:1px solid #e4e8ef;border-radius:14px;padding:16px;min-height:58px}.value{font-weight:700;margin-top:7px}.good{color:#087f3e}.warn{color:#9a5b00}.bad{color:#a11}.toolbar{margin:18px 0;display:flex;gap:9px;flex-wrap:wrap}input,select,button{padding:10px;border:1px solid #ccd3df;border-radius:8px}button{cursor:pointer;background:#fff}table{width:100%;background:#fff;border-collapse:collapse;border-radius:12px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid #edf0f4;text-align:left}.section{margin-top:24px}.small{font-size:12px;color:#667085}</style></head><body><main><h1>SAFEWEB GATEWAY</h1><div class="grid"><div class="card">Service<div class="value good">● Local</div></div><div class="card">Hotspot<div id="hotspot" class="value">...</div></div><div class="card">Enforcement<div id="enforcement" class="value">...</div></div><div class="card">Mode<div id="mode" class="value">...</div></div><div class="card">QUIC<div id="quic" class="value">...</div></div></div><div class="toolbar"><select id="modeSelect"><option value="blocklist">BLOCKLIST</option><option value="allowlist">ALLOWLIST</option></select><button onclick="setMode()">Apply Mode</button><input id="domain" placeholder="example.com"><select id="action"><option>BLOCK</option><option>ALLOW</option></select><button onclick="addRule()">Add Rule</button><button onclick="toggleQuic()" id="quicBtn">...</button><button onclick="refresh()">Refresh</button></div><div class="small" id="network"></div><div class="section"><h2>Rules</h2><table><thead><tr><th>Domain</th><th>Action</th><th>Enabled</th><th>Scope</th><th></th></tr></thead><tbody id="rules"></tbody></table></div><div class="section"><h2>Local Activity</h2><table><thead><tr><th>Time</th><th>Device</th><th>Domain</th><th>Action</th><th>Reason</th><th>Count</th></tr></thead><tbody id="activity"></tbody></table></div></main><script>async function j(u,o){let r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()}async function refresh(){let s=await j('/api/status');mode.textContent=s.mode.toUpperCase();modeSelect.value=s.mode;hotspot.textContent=s.hotspot.detected?'● '+s.hotspot.gateway:'○ waiting';hotspot.className='value '+(s.hotspot.detected?'good':'warn');enforcement.textContent=s.enforcement;enforcement.className='value '+(s.enforcement.startsWith('active')?'good':s.enforcement==='WinDivert-missing'?'warn':'warn');quic.textContent=s.blockQuic?'Blocked':'Allowed';quicBtn.textContent=s.blockQuic?'Allow QUIC':'Block QUIC';network.textContent=s.hotspot.detected?`Interface: ${s.hotspot.interfaceName} | Index: ${s.hotspot.interfaceIndex} | Subnet: ${s.hotspot.subnet}`:'Windows Mobile Hotspot interface 192.168.137.1 not detected';let r=await j('/api/rules');rules.innerHTML=r.map(x=>`<tr><td>${esc(x.domain)}</td><td>${x.action}</td><td>${x.enabled?'Yes':'No'}</td><td>${x.scope}</td><td><button onclick="del(${x.id})">Delete</button></td></tr>`).join('');let a=await j('/api/activity');activity.innerHTML=a.map(x=>`<tr><td>${new Date(x.timestamp).toLocaleString()}</td><td>${esc(x.device)}</td><td>${esc(x.domain)}</td><td>${x.action}</td><td>${esc(x.reason)}</td><td>${x.count}</td></tr>`).join('')}function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function addRule(){let d=domain.value.trim();if(!d)return;await j('/api/rules',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({domain:d,action:action.value,enabled:true,scope:'global'})});domain.value='';refresh()}async function del(id){await fetch('/api/rules/'+id,{method:'DELETE'});refresh()}async function setMode(){await j('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:modeSelect.value})});refresh()}async function toggleQuic(){let s=await j('/api/status');await j('/api/network/quic',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({block:!s.blockQuic})});refresh()}refresh();setInterval(refresh,5000)</script></body></html>
