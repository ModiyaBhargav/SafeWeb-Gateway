name: SafeWeb Windows x64 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safeweb-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .NET 8 Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore .\src\SafeWebGateway\SafeWebGateway.csproj --runtime win-x64

      - name: Build Release
        run: dotnet build .\src\SafeWebGateway\SafeWebGateway.csproj --configuration Release --runtime win-x64 --no-restore

      - name: Publish Windows x64 application
        run: dotnet publish .\src\SafeWebGateway\SafeWebGateway.csproj --configuration Release --runtime win-x64 --self-contained false --no-restore --output .\artifacts\publish

      - name: Create build provenance and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = '${{ github.sha }}'
          $ref = '${{ github.ref }}'
          $version = (git describe --tags --always)
          @(
            "Project: SafeWeb Gateway"
            "Version: $version"
            "Commit: $commit"
            "Git ref: $ref"
            "Runner: Windows x64"
            ".NET SDK: 8.0.x"
            "Runtime target: win-x64 (framework-dependent; .NET 8 runtime required)"
            "Signing: unsigned CI build"
            "WinDivert: not bundled; obtain only through the project's documented installer and upstream release"
          ) | Set-Content -Path .\artifacts\BUILD-INFO.txt -Encoding utf8
          $publishRoot = (Resolve-Path .\artifacts\publish).Path
          Get-ChildItem .\artifacts\publish -File -Recurse | ForEach-Object {
            $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
            $relative = $_.FullName.Substring($publishRoot.Length + 1)
            "$($hash.Hash)  $relative"
          } | Set-Content -Path .\artifacts\SHA256SUMS.txt -Encoding utf8

      - name: Assemble Windows distribution package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path (Resolve-Path .\artifacts).Path 'SafeWeb-Gateway-v4.5-win-x64'
          New-Item -ItemType Directory -Force -Path (Join-Path $stage 'app') | Out-Null
          Copy-Item .\artifacts\publish\* (Join-Path $stage 'app') -Recurse -Force
          Copy-Item .\distribution\Start-SafeWeb.cmd $stage
          Copy-Item .\distribution\Install-And-Run.ps1 $stage
          Copy-Item .\distribution\README-INSTALL.txt $stage
          Copy-Item .\README.md $stage
          Copy-Item .\LICENSE $stage
          Copy-Item .\THIRD-PARTY-NOTICES.md $stage
          Copy-Item .\docs\LIMITATIONS.md $stage
          Copy-Item .\artifacts\BUILD-INFO.txt $stage
          $files = Get-ChildItem $stage -File -Recurse
          $root = (Resolve-Path $stage).Path
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            $relative = $file.FullName.Substring($root.Length + 1)
            "$($hash.Hash)  $relative"
          }
          $lines | Set-Content (Join-Path $stage 'SHA256SUMS.txt') -Encoding utf8
          $zip = Join-Path (Resolve-Path .\artifacts).Path 'SafeWeb-Gateway-v4.5-win-x64.zip'
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -CompressionLevel Optimal -Force

      - name: Upload Windows distribution package
        uses: actions/upload-artifact@v6
        with:
          name: SafeWeb-Gateway-v4.5-win-x64-package
          path: artifacts/SafeWeb-Gateway-v4.5-win-x64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned build artifact
        uses: actions/upload-artifact@v6
        with:
          name: SafeWeb-Gateway-win-x64-${{ github.sha }}
          path: |
            artifacts/publish/
            artifacts/BUILD-INFO.txt
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
